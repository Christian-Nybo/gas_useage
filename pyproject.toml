[project]
name = "gas_useage"
version = "0.1.0"
description = "Streamlit dashboard for tracking household gas usage."
requires-python = ">=3.12"
authors = [
    { name = "Christian Nielsen", email = "christian.nielsen@dentsu.com" }
]
dependencies = [
    "altair~=5.5.0",
    "pandas~=2.3.0",
    "pydantic-settings>=2.14.1",
    "streamlit~=1.46.1",
    "supabase~=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gas_useage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN201", "ANN202"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "unit: fast, isolated unit tests (default)",
    "integration: tests that touch external systems",
]

[tool.coverage.run]
branch = true
source = ["src/gas_useage"]
omit = [
    "*/__init__.py",
    "*/__main__.py",
    "src/gas_useage/app.py",
    "src/gas_useage/charts.py",
    "src/gas_useage/data.py",
    "src/gas_useage/db.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.6.0",
]
