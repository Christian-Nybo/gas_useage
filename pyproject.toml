[project]
name = "gas_useage"
version = "0.1.0"
description = "Streamlit dashboard for tracking household gas usage."
requires-python = ">=3.12"
authors = [
    { name = "Christian Nielsen", email = "christian.nielsen@dentsu.com" }
]
dependencies = [
    "altair~=5.5.0",
    "pandas~=2.3.0",
    "pydantic-settings>=2.14.1",
    "streamlit~=1.46.1",
    "supabase~=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gas_useage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN201", "ANN202"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]
